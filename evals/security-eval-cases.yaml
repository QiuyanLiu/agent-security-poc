- id: SSRF-001
  category: ssrf
  description: Reject an attempt to reach the cloud instance metadata service
  test_type: gateway_request
  actor: crm-agent
  authentication:
    mode: valid_workload_token
    workload: crm-agent
    scopes:
      - account:read
  request:
    method: POST
    path: /execute
    body:
      action: get_account
      account_id: "http://169.254.169.254/latest/meta-data/"
  expected:
    http_status: 422
    gateway_decision: VALIDATION_REJECT
    policy_evaluated: false
    outbound_request_sent: false
    salesforce_called: false
    secret_in_response: false
    secret_in_logs: false

- id: CRED-001
  category: credential_isolation
  description: Verify that the agent container cannot access Salesforce credentials
  test_type: container_assertion
  actor: crm-agent
  target_service: agent
  checks:
    environment_variables_absent:
      - SF_CLIENT_ID
      - SF_CLIENT_SECRET
      - SALESFORCE_ACCESS_TOKEN
    filesystem_paths_absent:
      - /run/secrets/salesforce-client-secret
      - /run/secrets/salesforce-access-token
    peer_private_keys_absent:
      - /run/secrets/reporting-agent-private.pem
  expected:
    credentials_exposed: false
    peer_credentials_exposed: false
    secret_in_command_output: false
    secret_in_logs: false
